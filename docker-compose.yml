services:
  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.10-slim-bookworm}
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      FILE_COUNT: ${FILE_COUNT:-10}
      FILE_SIZE: ${FILE_SIZE:-1024}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_NAME}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://georeport.ru}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      SUPERUSER_NAME: ${SUPERUSER_NAME}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      AWS_URI: ${AWS_URI}
      AWS_ACCCESS_KEY: ${AWS_ACCCESS_KEY}
      AWS_SERVICE_NAME: ${AWS_SERVICE_NAME:-s3}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET}
      REDIS_URL: redis://redis:6379
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    expose:
      - "80"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    expose:
      - "6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - sed 's/\r$//' /etc/nginx/georeport/nginx-cert-watcher.sh > /tmp/nginx-cert-watcher.sh && /bin/sh /tmp/nginx-cert-watcher.sh && exec nginx -g 'daemon off;'
    volumes:
      - ./server/conf.d/app.conf:/etc/nginx/georeport/app.conf:ro
      - ./server/conf.d/acme-http.conf:/etc/nginx/georeport/acme-http.conf:ro
      - ./server/nginx-cert-watcher.sh:/etc/nginx/georeport/nginx-cert-watcher.sh:ro
      - ./server/proxy_params.conf:/etc/nginx/snippets/proxy_params.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - webroot-path:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    restart: unless-stopped
    volumes:
      - ./server/certbot-manager.sh:/opt/georeport/certbot-manager.sh:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot-path:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - sed 's/\r$//' /opt/georeport/certbot-manager.sh > /tmp/certbot-manager.sh && exec /bin/sh /tmp/certbot-manager.sh "$$@"
      - --
    command: ["daemon"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  redis_data:
  certbot-etc:
  certbot-var:
  webroot-path:
