services:
  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.10-slim-bookworm}
    environment:
      FILE_COUNT: "10"
      FILE_SIZE: "1024"
      DATABASE_URL: postgresql+asyncpg://georeport:georeport@postgres:5432/georeport
      PUBLIC_BASE_URL: http://localhost
      SEED_DEMO_DATA: "true"
      JWT_SECRET: test-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: "3600"
      SUPERUSER_NAME: admin
      SUPERUSER_PASSWORD: admin
      AWS_URI: http://minio:9000
      AWS_ACCCESS_KEY: minioadmin
      AWS_SERVICE_NAME: s3
      AWS_SECRET_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_BUCKET: georeport
      REDIS_URL: redis://redis:6379
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    expose:
      - "80"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  server:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "80:80"
    volumes:
      - ./server/test.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/proxy_params.conf:/etc/nginx/snippets/proxy_params.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    environment:
      POSTGRES_USER: georeport
      POSTGRES_PASSWORD: georeport
      POSTGRES_DB: georeport
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georeport"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    expose:
      - "6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data

  createbuckets:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        attempt=0
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "MinIO did not become ready in 60 seconds" >&2
            exit 1
          fi
          echo "MinIO is not ready yet; retrying in 2 seconds"
          sleep 2
        done
        /usr/bin/mc mb local/georeport --ignore-existing
        /usr/bin/mc anonymous set public local/georeport

volumes:
  postgres_data:
  redis_data:
  minio_data:
