limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_rate:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

upstream georeport_backend {
    server backend:8000;
    keepalive 16;
}

upstream georeport_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name georeport.ru www.georeport.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://georeport.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name georeport.ru www.georeport.ru;
    server_tokens off;

    if ($host = www.georeport.ru) {
        return 308 https://georeport.ru$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/georeport.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/georeport.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;
    limit_conn per_ip 40;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /metrics {
        return 404;
    }

    location = /auth/sign-in/ {
        limit_req zone=auth_rate burst=5 nodelay;
        proxy_pass http://georeport_backend;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location ~ ^/(?:auth|reports|files|s3|stat|test_type_files|static|docs|redoc)(?:/|$) {
        limit_req zone=api_rate burst=60 nodelay;
        proxy_pass http://georeport_backend;
        include /etc/nginx/snippets/proxy_params.conf;
        proxy_read_timeout 300s;
    }

    location = /openapi.json {
        limit_req zone=api_rate burst=60 nodelay;
        proxy_pass http://georeport_backend;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    location / {
        proxy_pass http://georeport_frontend;
        include /etc/nginx/snippets/proxy_params.conf;
    }
}
